schema_version: "1.1"
name: check-in-plain
tags: [trigger]
plugins: ["../../.."]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "check in"
graders:
  - name: fires-check-in
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(guild:)?check-in"'

