schema_version: "1.1"
name: shift-night
tags: [trigger]
plugins: ["../../.."]
runs: 3
execution:
  max_turns: 4
  allowed_tools: [Skill, Read, Glob, Grep]
  prompt: "take the night shift and work the guild board while I'm away"
graders:
  - name: fires-shift
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(guild:)?shift"'

